<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة إدارة المخزون الذكية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --accent: #00d4aa;
    --accent2: #7c6af7;
    --warn: #f0a500;
    --danger: #f85149;
    --success: #3fb950;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-muted: #484f58;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0,212,170,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,106,247,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Grid pattern */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(48,54,61,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,54,61,0.4) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,212,170,0.1);
    border: 1px solid rgba(0,212,170,0.3);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 0.78rem;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title::before {
    content: '';
    width: 4px;
    height: 20px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 4px;
    flex-shrink: 0;
  }

  /* Input Groups */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .input-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }

  .input-group label span {
    color: var(--accent);
    margin-left: 4px;
  }

  .options-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .option-btn {
    flex: 1;
    min-width: 100px;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .option-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,170,0.05);
  }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(0,212,170,0.12);
    color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
  }

  .option-btn.selected-warn {
    border-color: var(--warn);
    background: rgba(240,165,0,0.12);
    color: var(--warn);
    box-shadow: 0 0 0 3px rgba(240,165,0,0.1);
  }

  .option-btn.selected-danger {
    border-color: var(--danger);
    background: rgba(248,81,73,0.12);
    color: var(--danger);
    box-shadow: 0 0 0 3px rgba(248,81,73,0.1);
  }

  /* Analyze Button */
  .analyze-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #00b894);
    border: none;
    border-radius: 12px;
    color: #0d1117;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .analyze-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,212,170,0.3);
  }

  .analyze-btn:active { transform: translateY(0); }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Result Card */
  .result-card {
    display: none;
    animation: fadeUp 0.5s ease both;
  }

  .result-card.show { display: block; }

  .result-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 20px;
  }

  .result-icon {
    font-size: 2.5rem;
    flex-shrink: 0;
  }

  .result-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .result-title {
    font-size: 1.6rem;
    font-weight: 900;
    line-height: 1.2;
  }

  /* Result colors */
  .result-reorder-urgent {
    background: linear-gradient(135deg, rgba(248,81,73,0.15), rgba(248,81,73,0.05));
    border: 1px solid rgba(248,81,73,0.4);
  }
  .result-reorder-urgent .result-title { color: #f85149; }

  .result-reorder {
    background: linear-gradient(135deg, rgba(63,185,80,0.15), rgba(63,185,80,0.05));
    border: 1px solid rgba(63,185,80,0.4);
  }
  .result-reorder .result-title { color: #3fb950; }

  .result-none {
    background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(0,212,170,0.05));
    border: 1px solid rgba(0,212,170,0.4);
  }
  .result-none .result-title { color: var(--accent); }

  .result-clearance {
    background: linear-gradient(135deg, rgba(240,165,0,0.15), rgba(240,165,0,0.05));
    border: 1px solid rgba(240,165,0,0.4);
  }
  .result-clearance .result-title { color: var(--warn); }

  .result-clearance-urgent {
    background: linear-gradient(135deg, rgba(248,81,73,0.2), rgba(240,165,0,0.1));
    border: 1px solid rgba(248,81,73,0.5);
  }
  .result-clearance-urgent .result-title { color: #f85149; }

  /* XAI Section */
  .xai-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .xai-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
    transition: background 0.2s;
    user-select: none;
  }

  .xai-header:hover { background: rgba(124,106,247,0.05); }

  .xai-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent2);
  }

  .xai-toggle {
    font-size: 0.8rem;
    color: var(--text-dim);
    transition: transform 0.3s;
  }

  .xai-toggle.open { transform: rotate(180deg); }

  .xai-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
  }

  .xai-body.open { display: block; }

  .xai-steps {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .xai-step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .xai-step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(124,106,247,0.2);
    border: 1px solid rgba(124,106,247,0.4);
    color: var(--accent2);
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .xai-step-text {
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .xai-step-text strong { color: var(--text); }

  .xai-rule {
    margin-top: 16px;
    background: rgba(124,106,247,0.08);
    border: 1px solid rgba(124,106,247,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.83rem;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .xai-rule strong { color: var(--accent2); }

  /* Summary Tags */
  .summary-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .tag {
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 0.78rem;
    font-weight: 700;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  /* Reset btn */
  .reset-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
  }

  .reset-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .footer span { color: var(--accent); }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-badge">🤖 نظام ذكاء اصطناعي — XAI مدعوم</div>
    <h1>منصة إدارة المخزون الذكية</h1>
    <p>أدخل بيانات المنتج واحصل على قرار فوري مع شرح كامل للمنطق المستخدم</p>
  </div>

  <!-- Input Card -->
  <div class="card" id="input-card">
    <div class="card-title">بيانات المنتج</div>
    <div class="input-grid">

      <!-- مستوى المخزون -->
      <div class="input-group">
        <label>مستوى المخزون <span>*</span></label>
        <div class="options-row" id="stock-options">
          <button class="option-btn" onclick="select(this,'stock','منخفض','danger')">📉 منخفض</button>
          <button class="option-btn" onclick="select(this,'stock','متوسط','warn')">📊 متوسط</button>
          <button class="option-btn" onclick="select(this,'stock','مرتفع','')">📈 مرتفع</button>
        </div>
      </div>

      <!-- معدل الحركة -->
      <div class="input-group">
        <label>معدل حركة المنتج <span>*</span></label>
        <div class="options-row" id="movement-options">
          <button class="option-btn" onclick="select(this,'movement','سريع','')">⚡ سريع</button>
          <button class="option-btn" onclick="select(this,'movement','بطيء','warn')">🐢 بطيء</button>
        </div>
      </div>

      <!-- انتهاء الصلاحية -->
      <div class="input-group">
        <label>قرب انتهاء الصلاحية <span>*</span></label>
        <div class="options-row" id="expiry-options">
          <button class="option-btn" onclick="select(this,'expiry','نعم','danger')">⚠️ نعم</button>
          <button class="option-btn" onclick="select(this,'expiry','لا','')">✅ لا</button>
        </div>
      </div>

    </div>

    <button class="analyze-btn" onclick="analyze()" id="analyze-btn" disabled>
      🔍 تحليل واتخاذ القرار
    </button>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="result-card">
    <div class="card">
      <div class="card-title">نتيجة التحليل</div>

      <!-- Summary Tags -->
      <div class="summary-tags" id="summary-tags"></div>

      <!-- Result Header -->
      <div class="result-header" id="result-header">
        <div class="result-icon" id="result-icon"></div>
        <div>
          <div class="result-label">القرار الموصى به</div>
          <div class="result-title" id="result-title"></div>
        </div>
      </div>

      <!-- XAI Section -->
      <div class="xai-section">
        <div class="xai-header" onclick="toggleXAI()">
          <div class="xai-header-left">
            🧠 لماذا هذا القرار؟ <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(اضغط لعرض الشرح)</span>
          </div>
          <div class="xai-toggle" id="xai-toggle">▼</div>
        </div>
        <div class="xai-body" id="xai-body">
          <div class="xai-steps" id="xai-steps"></div>
          <div class="xai-rule" id="xai-rule"></div>
        </div>
      </div>

      <button class="reset-btn" onclick="reset()">🔄 تحليل منتج آخر</button>
    </div>
  </div>

  <div class="footer">
    منصة إدارة المخزون الذكية — مبنية بـ <span>Claude AI</span> — نظام قرار شفاف (XAI)
  </div>

</div>

<script>
  const state = { stock: null, movement: null, expiry: null };

  function select(btn, field, value, colorClass) {
    // Deselect all in group
    const group = document.getElementById(field + '-options');
    group.querySelectorAll('.option-btn').forEach(b => {
      b.classList.remove('selected','selected-warn','selected-danger');
    });

    // Select this
    if (colorClass === 'danger') btn.classList.add('selected-danger');
    else if (colorClass === 'warn') btn.classList.add('selected-warn');
    else btn.classList.add('selected');

    state[field] = value;
    checkReady();
  }

  function checkReady() {
    const ready = state.stock && state.movement && state.expiry;
    document.getElementById('analyze-btn').disabled = !ready;
  }

  function analyze() {
    const { stock, movement, expiry } = state;
    let decision, icon, cssClass, steps, rule;

    // Decision Logic
    if (stock === 'منخفض' && movement === 'سريع' && expiry === 'نعم') {
      decision = 'إعادة طلب عاجل 🚨';
      icon = '🚨';
      cssClass = 'result-reorder-urgent';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = منخفض</strong> — المخزون وصل لمستوى حرج ويحتاج تدخلاً فورياً.` },
        { num:2, text: `<strong>معدل الحركة = سريع</strong> — المنتج مطلوب بشكل كبير من العملاء.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = نعم</strong> — هناك ضغط إضافي من اقتراب انتهاء الصلاحية.` },
        { num:4, text: `<strong>النتيجة:</strong> اجتماع ثلاثة عوامل حرجة معاً يستوجب إعادة طلب عاجلة لتفادي نفاد المخزون.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = منخفض) <strong>و</strong> (الحركة = سريع) <strong>و</strong> (الصلاحية = قريبة) → <strong>إعادة طلب عاجل</strong>`;
    }
    else if (stock === 'منخفض' && movement === 'سريع' && expiry === 'لا') {
      decision = 'إعادة طلب ✅';
      icon = '📦';
      cssClass = 'result-reorder';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = منخفض</strong> — المخزون منخفض ويحتاج تجديداً.` },
        { num:2, text: `<strong>معدل الحركة = سريع</strong> — المنتج مطلوب ويُباع بسرعة.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = لا</strong> — لا ضغط من الصلاحية، الطلب طبيعي.` },
        { num:4, text: `<strong>النتيجة:</strong> مخزون منخفض مع طلب مرتفع يعني وجوب إعادة الطلب قريباً.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = منخفض) <strong>و</strong> (الحركة = سريع) <strong>و</strong> (الصلاحية = بعيدة) → <strong>إعادة طلب</strong>`;
    }
    else if (stock === 'منخفض' && movement === 'بطيء' && expiry === 'نعم') {
      decision = 'تصفية عاجلة ⚠️';
      icon = '⚠️';
      cssClass = 'result-clearance-urgent';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = منخفض</strong> — الكمية محدودة.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — المنتج لا يُباع بسرعة كافية.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = نعم</strong> — خطر انتهاء الصلاحية قبل البيع.` },
        { num:4, text: `<strong>النتيجة:</strong> يجب تصفية المنتج فوراً بخصم لتجنب خسارة كاملة عند انتهاء صلاحيته.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = منخفض) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = قريبة) → <strong>تصفية عاجلة</strong>`;
    }
    else if (stock === 'منخفض' && movement === 'بطيء' && expiry === 'لا') {
      decision = 'إعادة طلب ✅';
      icon = '📦';
      cssClass = 'result-reorder';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = منخفض</strong> — الكمية وصلت لمستوى منخفض.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — الطلب منخفض لكن المنتج لا يزال يُباع.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = لا</strong> — لا خطر من الصلاحية.` },
        { num:4, text: `<strong>النتيجة:</strong> رغم بطء الحركة، انخفاض المخزون يستوجب طلباً بكمية محدودة للحفاظ على التوافر.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = منخفض) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = بعيدة) → <strong>إعادة طلب</strong>`;
    }
    else if (stock === 'متوسط' && movement === 'سريع') {
      decision = 'لا إجراء ⏸';
      icon = '✅';
      cssClass = 'result-none';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = متوسط</strong> — الكمية كافية ولا تستوجب تدخلاً فورياً.` },
        { num:2, text: `<strong>معدل الحركة = سريع</strong> — المنتج يُباع بوتيرة جيدة.` },
        { num:3, text: `<strong>النتيجة:</strong> المخزون متوسط والطلب جيد، الوضع مستقر ولا يحتاج تدخلاً الآن.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = متوسط) <strong>و</strong> (الحركة = سريع) → <strong>لا إجراء</strong>`;
    }
    else if (stock === 'متوسط' && movement === 'بطيء' && expiry === 'لا') {
      decision = 'لا إجراء ⏸';
      icon = '✅';
      cssClass = 'result-none';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = متوسط</strong> — الكمية في نطاق مقبول.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — المبيعات بطيئة لكن لا خطر فورياً.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = لا</strong> — لا ضغط من الصلاحية.` },
        { num:4, text: `<strong>النتيجة:</strong> الوضع مستقر، يُنصح بمراقبة المنتج لكن لا إجراء فوري مطلوب.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = متوسط) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = بعيدة) → <strong>لا إجراء</strong>`;
    }
    else if (stock === 'متوسط' && movement === 'بطيء' && expiry === 'نعم') {
      decision = 'تصفية عاجلة ⚠️';
      icon = '⚠️';
      cssClass = 'result-clearance-urgent';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = متوسط</strong> — الكمية ليست ضئيلة لكنها ليست كبيرة.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — المنتج لا يُباع بسرعة كافية.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = نعم</strong> — خطر انتهاء الصلاحية قبل تصريف الكمية.` },
        { num:4, text: `<strong>النتيجة:</strong> تصفية عاجلة ضرورية لتجنب خسارة الكمية المتبقية.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = متوسط) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = قريبة) → <strong>تصفية عاجلة</strong>`;
    }
    else if (stock === 'مرتفع' && movement === 'سريع') {
      decision = 'لا إجراء ⏸';
      icon = '✅';
      cssClass = 'result-none';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = مرتفع</strong> — الكمية وفيرة وكافية للفترة القادمة.` },
        { num:2, text: `<strong>معدل الحركة = سريع</strong> — المنتج يُباع بوتيرة عالية.` },
        { num:3, text: `<strong>النتيجة:</strong> مخزون وفير مع طلب مرتفع — وضع مثالي لا يحتاج تدخلاً.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = مرتفع) <strong>و</strong> (الحركة = سريع) → <strong>لا إجراء</strong>`;
    }
    else if (stock === 'مرتفع' && movement === 'بطيء' && expiry === 'لا') {
      decision = 'تصفية 🏷️';
      icon = '🏷️';
      cssClass = 'result-clearance';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = مرتفع</strong> — الكمية كبيرة وتُكلّف تخزيناً.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — المنتج راكد ولا يُباع بسرعة كافية.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = لا</strong> — لا ضغط فوري لكن الركود يستمر.` },
        { num:4, text: `<strong>النتيجة:</strong> المنتج الراكد يرفع تكاليف التخزين — التصفية بخصم مناسب هي الحل الأمثل.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = مرتفع) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = بعيدة) → <strong>تصفية</strong>`;
    }
    else if (stock === 'مرتفع' && movement === 'بطيء' && expiry === 'نعم') {
      decision = 'تصفية عاجلة ⚠️';
      icon = '⚠️';
      cssClass = 'result-clearance-urgent';
      steps = [
        { num:1, text: `<strong>مستوى المخزون = مرتفع</strong> — الكمية كبيرة جداً.` },
        { num:2, text: `<strong>معدل الحركة = بطيء</strong> — المنتج راكد ولا يُباع.` },
        { num:3, text: `<strong>قرب انتهاء الصلاحية = نعم</strong> — خطر مزدوج: ركود + انتهاء صلاحية.` },
        { num:4, text: `<strong>النتيجة:</strong> الوضع حرج للغاية — تصفية عاجلة بخصم كبير لإنقاذ أكبر قدر ممكن من الكمية.` }
      ];
      rule = `<strong>القاعدة المنطقية:</strong> إذا كان (المخزون = مرتفع) <strong>و</strong> (الحركة = بطيء) <strong>و</strong> (الصلاحية = قريبة) → <strong>تصفية عاجلة</strong>`;
    }

    // Show result
    const resultCard = document.getElementById('result-card');
    const resultHeader = document.getElementById('result-header');
    const resultIcon = document.getElementById('result-icon');
    const resultTitle = document.getElementById('result-title');
    const summaryTags = document.getElementById('summary-tags');
    const xaiSteps = document.getElementById('xai-steps');
    const xaiRule = document.getElementById('xai-rule');

    resultHeader.className = 'result-header ' + cssClass;
    resultIcon.textContent = icon;
    resultTitle.textContent = decision;

    summaryTags.innerHTML = `
      <span class="tag">📦 ${stock}</span>
      <span class="tag">📊 ${movement}</span>
      <span class="tag">📅 ${expiry === 'نعم' ? 'قرب انتهاء الصلاحية' : 'صلاحية بعيدة'}</span>
    `;

    xaiSteps.innerHTML = steps.map(s => `
      <div class="xai-step">
        <div class="xai-step-num">${s.num}</div>
        <div class="xai-step-text">${s.text}</div>
      </div>
    `).join('');

    xaiRule.innerHTML = rule;

    document.getElementById('input-card').style.display = 'none';
    resultCard.classList.add('show');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function toggleXAI() {
    const body = document.getElementById('xai-body');
    const toggle = document.getElementById('xai-toggle');
    body.classList.toggle('open');
    toggle.classList.toggle('open');
  }

  function reset() {
    state.stock = null;
    state.movement = null;
    state.expiry = null;
    document.querySelectorAll('.option-btn').forEach(b => {
      b.classList.remove('selected','selected-warn','selected-danger');
    });
    document.getElementById('analyze-btn').disabled = true;
    document.getElementById('result-card').classList.remove('show');
    document.getElementById('input-card').style.display = 'block';
    document.getElementById('xai-body').classList.remove('open');
    document.getElementById('xai-toggle').classList.remove('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
